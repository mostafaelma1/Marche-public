name: Build APK

on:
  push:
    branches:
      - claude/bmarche-pro-android-uqf4of
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          validate-wrappers: false

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmarche-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: BMarche Pro — APK (debug, dernier build)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK de démonstration (debug) de BMarche Pro, généré automatiquement
            au dernier build de la branche `claude/bmarche-pro-android-uqf4of`.

            Téléchargez `app-debug.apk` ci-dessous, puis installez-le sur un
            téléphone Android (activez « Installer des applications inconnues »).
